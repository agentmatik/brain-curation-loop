name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Workflow exports parse and carry no credentials or instance ids
        run: |
          for f in n8n/*.json; do
            jq -e '.nodes | length > 0' "$f" > /dev/null
            if jq -e '[.nodes[] | select(.credentials != null)] | length > 0' "$f" > /dev/null; then
              echo "$f: credentials block present"; exit 1
            fi
            for key in id versionId staticData pinData; do
              if jq -e "has(\"$key\")" "$f" > /dev/null; then echo "$f: instance field $key present"; exit 1; fi
            done
          done
          grep -rn "REPLACE_WITH_" n8n/ > /dev/null || { echo "no placeholders found; was the export sanitized?"; exit 1; }

      - name: No long dashes in prose
        run: |
          ! grep -rnP "\x{2013}|\x{2014}" --include='*.md' . || { echo "long dash found"; exit 1; }

      - name: gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose
